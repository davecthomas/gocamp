  sourcesAndCaveats:
    - Distances, elevations, and drive times are planning estimates from public
      road and park data, not a live routing service. Confirm exact mileage,
      closures, and charger status before you lock dates.
    - Elevation-based range figures use the vehicle assumptions above and a
      simplified physics model; real-world range also depends on temperature,
      speed, wind, and payload.
    - Weather is 1991–2020 monthly climate normals from the nearest long-record
      station, not a forecast. Road opening dates are typical seasons; plowing
      progress sets the actual day each alpine road opens.
  howComputed:
    - <b>How range is computed:</b> consumption comes from the road-load
      equation, <span class="mono">F = Crr·m·g + ½·ρ·Cd·A·v²</span>. Rolling
      resistance rises with the load you carry; drag rises with the square of
      your speed. The model is calibrated against Lucid's 450-mile EPA figure.
      That is treated as what the default 620 lb load draws at 65 mph, or
      249&nbsp;Wh/mi, and everything scales from there. It assumes a 0.008
      rolling coefficient, Lucid's published 0.24 drag coefficient, and an
      estimated 2.7&nbsp;m² frontal area. Move the load or speed slider and the
      range, the Wh/mi, and every leg's climb cost all follow. The reserve
      slider sets the charge you refuse to go below. Usable range is what is
      left above it, and the planned charging interval is capped there no matter
      where the miles slider sits. Supercharger positions come from the
      supercharge.info database, filtered to sites within 12 miles of this
      route. The gap warning measures the real distance between consecutive
      sites.<br><b>How the climb tax is computed:</b> lifting the loaded car
      costs <span class="mono">energy = mass × g × Δheight</span>, divided by
      drivetrain efficiency. That energy is then converted into miles at
      whatever the car is drawing per mile right now, so the tax in miles falls
      as the cost per mile rises. Climbing legs apply an 88% drivetrain
      efficiency (extra draw); descending legs apply a 65% regen-recovery rate
      (partial refund) — batteries never return 100% of what gravity gave them.
      At current settings that works out to about <span class="mono"
      id="fmlClimb">12.5 mi</span> spent per 1,000&nbsp;ft climbed and <span
      class="mono" id="fmlDescent">7.2 mi</span> recovered per 1,000&nbsp;ft
      descended.
    - <b>How the dates are computed:</b> the schedule walks the route leg by
      leg. A driving day caps at 7.5 hours behind the wheel, and each park or
      camp stop holds you for the number of nights set above. Leg times scale
      with the speed setting from a 65 mph baseline, so park and mountain roads
      stay proportionally slower than the interstate stretches. Set either date
      and the other moves with it. Weather figures are 1991–2020 monthly normals
      from the nearest long-record station, named on each stop.
