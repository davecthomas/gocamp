content:
  callouts:
    - tone: clay
      title: Where the climbs cost the most range
      paragraphs:
        - Two climbs dominate the trip. <b>Trail Ridge Road</b> runs from Estes
          Park (7,522 ft) to the Alpine Visitor Center (12,183 ft), a 4,661 ft
          gain in 25 miles. <b>Logan Pass</b>, on the branch, climbs from
          Missoula (3,209 ft) to 6,646 ft. Both are short enough that the range
          cost stays manageable. The descent that follows is the bigger planning
          risk. Regen won't refill what the climb spent, so leave more buffer
          than the raw mileage suggests on the way down.
    - tone: alpine
      title: "National park vs. national forest: where dogs can walk"
      paragraphs:
        - "Every full national park on this route bans dogs from trails and
          boardwalks: Rocky Mountain, Grand Teton, Yellowstone, and Glacier.
          Leashed pets are allowed only in campgrounds, parking areas, and
          within about 100 ft of roads. The national forest and state park
          stretches are the opposite. At Palo Duro Canyon, Golden Gate Canyon,
          and Bridger-Teton, leashed dogs are welcome on nearly every trail.
          Plan trail hikes for the gaps between parks, and treat the parks
          themselves as scenic-drive and campground days for the dog."
    - tone: alpine
      title: No single pass covers the whole route
      paragraphs:
        - The <b>America the Beautiful</b> annual pass costs $80. It covers
          entrance at all four national parks on this line, plus standard
          day-use fees on federal land like the Bridger-Teton stretch. It does
          not cover state parks. Texas, Colorado, and Idaho each run their own
          gate, and their annual passes would total $230 to pass through once
          each.
        - Buy the federal pass, pay the three state parks at the gate. Rocky
          Mountain, Grand Teton, and Yellowstone alone come to $105 at the gate.
          The pass pays for itself at the third park, and this route has at
          least three.
    - tone: clay
      title: Reservations you need on top of a pass
      paragraphs:
        - <b>Rocky Mountain</b> runs a timed-entry system from late May to
          mid-October. It applies 9am to 2pm for most of the park, and 5am to
          6pm on the Bear Lake Road corridor. A reservation costs a $2
          Recreation.gov processing fee and does not replace the entrance fee.
          Entering outside those hours needs no reservation.
        - <b>Glacier</b> required a vehicle reservation for Going-to-the-Sun
          Road in past summers. The park says none is required anywhere in 2026.
          Check again before a 2027 trip; this has changed year to year.
  checklist:
    - title: Campsites
      items:
        - Jenny Lake &amp; Colter Bay (Teton) and Canyon/Grant Village
          (Yellowstone) release on Recreation.gov 6 months out to the day. Set
          an alarm.
        - Timber Creek (RMNP west side) is first-come outside peak booking
          windows; Moraine Park books out fast in July.
        - Apgar &amp; Fish Creek (Glacier) also run a 6-month Recreation.gov
          window in summer.
    - title: Permits &amp; passes
      items:
        - America the Beautiful, $80, covers all four national parks and pays
          for itself at the third one. See Passes and fees above.
        - RMNP timed-entry permits run late May to mid-October and cost a $2
          processing fee on top of entry.
        - Glacier needed no vehicle reservation in 2026, after several summers
          of requiring one. Re-check before you book.
    - title: Charging
      items:
        - NACS-native Gravity reaches Tesla Superchargers along I-40, I-25, and
          I-90 without an adapter.
        - Coverage thins between Jackson and Yellowstone and again around
          Glacier. Top up to 100% before both stretches, not the usual 80%.
        - Cold mountain nights (Trail Ridge, Logan Pass, Yellowstone shoulder
          season) cut range further than this calculator's climb math alone.
          Precondition the battery before departing camp.
    - title: For the dog
      items:
        - Carry proof of rabies vaccination. Yellowstone and Glacier rangers
          check leash and pet-in-vehicle rules.
        - Never leave a dog in the car at altitude trailheads, even briefly.
          Thin air and sun make cars overheat faster than expected.
        - Bridger-Teton NF (between Rawlins and Jackson) is the longest mid-trip
          stretch where dogs are allowed on trails.
