# The Rockies Line.
# A scenario is data, not code: legs, geometry, chargers and vehicle assumptions.
# Shared reference data (climate normals) lives in lib/data and is keyed by station.

slug: rockies-line
name: The Rockies Line
eyebrow: Scenario 1
headline: Austin to Seattle, park to park
summary: Palo Duro Canyon, Golden Gate Canyon, Rocky Mountain, Grand Teton, and
  Yellowstone all sit within a few miles of this line. Glacier is a marked
  branch off it. Built for a 2027 Lucid Gravity GT and a dog who’s happiest off
  leash in the gaps between parks.
statesCrossed: 6
vehicle:
  name: 2027 Lucid Gravity GT (Grand Touring)
  batteryKwh: 112
  epaRangeMi: 450
  curbLb: 6173
  dragCoefficient: 0.24
  frontalAreaM2: 2.7
  rollingResistance: 0.008
  drivetrainEfficiency: 0.9
  climbEfficiency: 0.88
  regenRecovery: 0.65
  fastChargeNote: 10–80% in ≈20 min
  port: NACS
  sourceNote: Lucid’s published Gravity numbers, carried forward as a 2027
    planning estimate. Confirm your build’s EPA rating and wheel size before you
    set a charging plan; larger wheels trade range for grip.
defaults:
  cadenceMi: 250
  nights: 1
  avgSpeedMph: 65
  payloadLb: 620
  reservePct: 25
  startDate: 2027-06-19
  includeBranch: false
payloadBreakdown:
  adults: 370
  dog: 50
  gear: 200
branch:
  id: glacier
  label: Include the Glacier NP branch
  sublabel: Missoula → Logan Pass → rejoin near Spokane
